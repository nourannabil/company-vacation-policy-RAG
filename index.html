<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Company Vacation AI Assistant</title><style>body{    font-family: Arial, Helvetica, sans-serif;    background: linear-gradient(135deg,#4f46e5,#06b6d4);    height:100vh;    display:flex;    justify-content:center;    align-items:center;    margin:0;}.container{    background:white;    width:500px;    border-radius:15px;    box-shadow:0 10px 25px rgba(0,0,0,0.2);    padding:25px;}h1{    text-align:center;    margin-bottom:20px;    color:#333;}.chat-box{    height:300px;    overflow-y:auto;    border:1px solid #eee;    border-radius:10px;    padding:10px;    margin-bottom:15px;    background:#fafafa;}.message{    margin:8px 0;}.user{    text-align:right;    color:#2563eb;}.bot{    text-align:left;    color:#111827;}.input-area{    display:flex;}input{    flex:1;    padding:10px;    border-radius:8px;    border:1px solid #ccc;    outline:none;}button{    margin-left:10px;    padding:10px 16px;    border:none;    border-radius:8px;    background:#4f46e5;    color:white;    cursor:pointer;    font-weight:bold;}button:hover{    background:#3730a3;}</style></head><body><div class="container"><h1>Vacation Policy Assistant</h1><div class="chat-box" id="chat"></div><div class="input-area"><input id="question" placeholder="Ask about employees or vacation policy..." /><button onclick="ask()">Ask</button></div></div><script>async function ask(){let question = document.getElementById("question").valuelet chat = document.getElementById("chat")if(question.trim()=="") returnchat.innerHTML += `<div class="message user"><b>You:</b> ${question}</div>`let response = await fetch("http://127.0.0.1:8000/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:question})})let data = await response.json()chat.innerHTML += `<div class="message bot"><b>AI:</b> ${data.answer}</div>`document.getElementById("question").value=""chat.scrollTop = chat.scrollHeight}</script></body></html>
